name: quality
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile collectors/python/collector.py scraper/radar_spider/spiders/catalogo.py
      - run: python -m json.tool data/sample-signals.json > /dev/null
